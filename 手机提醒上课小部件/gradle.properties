# B1-1：Gradle 全局配置
# 注：不设 file.encoding=UTF-8——daemon 与测试 worker JVM 的 @argfile 均按本地 GBK
# 编解码才一致；显式 UTF-8 会让 JDK17 启动器按 GBK 读 UTF-8 argfile，worker 起不来
org.gradle.jvmargs=-Xmx2048m
android.useAndroidX=true
android.nonTransitiveRClass=true
# 工程路径含中文（用户指定目录），按 AGP 官方开关跳过路径检查
android.overridePathCheck=true
kotlin.code.style=official
